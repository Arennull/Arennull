  <rect width="1200" height="64" fill="#05030A"/>

  <path d="M24 32H216L244 18H360L386 32H586" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" opacity="0.18"/>
  <path d="M614 32H814L842 46H956L984 32H1176" stroke="#FF2A6D" stroke-width="8" stroke-linecap="round" opacity="0.18"/>

