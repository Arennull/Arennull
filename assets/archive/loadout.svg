<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arennull loadout — current stack matrix">
  <defs>
    <pattern id="lo-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#18243F" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="lo-edge" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2A6D"/>
      <stop offset="0.55" stop-color="#FCEE0A"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="lo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "Cascadia Mono", "Fira Code", Consolas, monospace; }
      .h    { fill:#8FA6C8; font-size:14px; letter-spacing:2px; }
      .k    { fill:#EAF7FF; font-size:18px; font-weight:700; }
      .v    { fill:#B9C7E6; font-size:15px; }
      .pin  { fill:#FF2A6D; }
      .cy   { fill:#00F0FF; }
      .yl   { fill:#FCEE0A; }
      .mu   { fill:#6E84AC; font-size:12px; letter-spacing:1.5px; }
    </style>
  </defs>

  <rect width="1200" height="220" rx="16" fill="#05030A"/>
  <rect width="1200" height="220" rx="16" fill="url(#lo-grid)" opacity="0.85"/>
  <rect x="6" y="6" width="1188" height="208" rx="12" stroke="url(#lo-edge)" stroke-width="2" filter="url(#lo-glow)"/>

  <text class="mono mu" x="24" y="28">LOADOUT // CURRENT_STACK_MATRIX</text>
  <text class="mono mu" x="1010" y="28">SLOT 04/04 EQUIPPED</text>

  <g transform="translate(24,52)">
    <rect width="280" height="148" rx="10" fill="#0A0716" stroke="#243657"/>
    <text class="mono h" x="16" y="28">[ SLOT_01 ] LANG</text>
    <text class="mono k cy" x="16" y="60">TypeScript</text>
    <text class="mono v" x="16" y="86">React · Node · Prisma</text>
    <text class="mono v" x="16" y="108">Java · Python</text>
    <line x1="16" y1="124" x2="264" y2="124" stroke="#18243F"/>
    <text class="mono mu" x="16" y="140">primary route · default reach</text>
  </g>

  <g transform="translate(316,52)">
    <rect width="280" height="148" rx="10" fill="#0A0716" stroke="#243657"/>
    <text class="mono h" x="16" y="28">[ SLOT_02 ] SHIP</text>
    <text class="mono k yl" x="16" y="60">Railway</text>
    <text class="mono v" x="16" y="86">Vercel · Cloudflare</text>
    <text class="mono v" x="16" y="108">GitHub Actions · Docker</text>
    <line x1="16" y1="124" x2="264" y2="124" stroke="#18243F"/>
    <text class="mono mu" x="16" y="140">small ships · fast lanes</text>
  </g>

  <g transform="translate(608,52)">
    <rect width="280" height="148" rx="10" fill="#0A0716" stroke="#243657"/>
    <text class="mono h" x="16" y="28">[ SLOT_03 ] INTEL</text>
    <text class="mono k pin" x="16" y="60">AI + Data</text>
    <text class="mono v" x="16" y="86">OpenAI · Hugging Face</text>
    <text class="mono v" x="16" y="108">Postgres · MySQL</text>
    <line x1="16" y1="124" x2="264" y2="124" stroke="#18243F"/>
    <text class="mono mu" x="16" y="140">data → model → API</text>
  </g>

  <g transform="translate(900,52)">
    <rect width="276" height="148" rx="10" fill="#0A0716" stroke="#243657"/>
    <text class="mono h" x="16" y="28">[ SLOT_04 ] EDGE</text>
    <text class="mono k" x="16" y="60">Sandbox</text>
    <text class="mono v" x="16" y="86">sec notes · controlled</text>
    <text class="mono v" x="16" y="108">refactor · trace · measure</text>
    <line x1="16" y1="124" x2="260" y2="124" stroke="#18243F"/>
    <text class="mono mu" x="16" y="140">curiosity · limits clear</text>
    <circle cx="252" cy="28" r="5" fill="#FCEE0A" filter="url(#lo-glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
