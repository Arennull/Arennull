<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arennull animated cyberpunk banner">
  <defs>
    <pattern id="bg-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#18243F" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0820"/>
      <stop offset="0.55" stop-color="#1A0838"/>
      <stop offset="1" stop-color="#05030A"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F0FF"/>
      <stop offset="0.55" stop-color="#FF2A6D"/>
      <stop offset="1" stop-color="#FCEE0A"/>
    </linearGradient>
    <linearGradient id="fade-mask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#000" stop-opacity="1"/>
      <stop offset="0.92" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="parallax-mask">
      <rect width="1600" height="500" fill="url(#fade-mask)"/>
    </mask>
    <filter id="b-glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="b-soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "Cascadia Mono","Fira Code",Consolas,monospace; }
      .title { font-size: 132px; font-weight: 800; letter-spacing: 8px; }
      .sub   { font-size: 24px; letter-spacing: 5px; }
      .meta  { font-size: 13px; letter-spacing: 2.2px; fill:#6E84AC; }
      .tag   { font-size: 16px; letter-spacing: 3px; fill:#B9C7E6; }
    </style>
  </defs>

  <rect width="1600" height="500" fill="url(#sky)"/>
  <rect width="1600" height="500" fill="url(#bg-grid)" opacity="0.75"/>

  <g mask="url(#parallax-mask)">
    <g opacity="0.25">
      <g transform="translate(0,330)">
        <path d="M0 70 L80 70 L80 20 L140 20 L140 50 L220 50 L220 10 L300 10 L300 60 L380 60 L380 30 L460 30 L460 55 L540 55 L540 15 L640 15 L640 60 L720 60 L720 30 L820 30 L820 50 L900 50 L900 20 L980 20 L980 55 L1080 55 L1080 25 L1180 25 L1180 60 L1280 60 L1280 30 L1380 30 L1380 50 L1480 50 L1480 20 L1600 20 L1600 80 L0 80 Z"
              fill="#1E3A6B" stroke="#3B5FAD" stroke-width="0.8"/>
        <animateTransform attributeName="transform" type="translate" values="0,330;-200,330;0,330" dur="40s" repeatCount="indefinite"/>
      </g>
    </g>
    <g opacity="0.45">
      <g transform="translate(0,360)">
        <path d="M0 90 L60 90 L60 30 L120 30 L120 65 L200 65 L200 20 L260 20 L260 70 L340 70 L340 35 L420 35 L420 60 L500 60 L500 25 L580 25 L580 55 L680 55 L680 30 L780 30 L780 60 L860 60 L860 25 L960 25 L960 50 L1040 50 L1040 20 L1140 20 L1140 60 L1240 60 L1240 35 L1340 35 L1340 55 L1440 55 L1440 25 L1560 25 L1600 35 L1600 100 L0 100 Z"
              fill="#172A4A" stroke="#FF2A6D" stroke-width="0.8" opacity="0.75"/>
        <animateTransform attributeName="transform" type="translate" values="0,360;-150,360;0,360" dur="28s" repeatCount="indefinite"/>
      </g>
    </g>
    <g opacity="0.7">
      <g transform="translate(0,390)">
        <path d="M0 110 L100 110 L100 50 L160 50 L160 90 L240 90 L240 30 L320 30 L320 80 L400 80 L400 45 L480 45 L480 75 L560 75 L560 35 L660 35 L660 80 L760 80 L760 50 L860 50 L860 75 L960 75 L960 40 L1060 40 L1060 80 L1160 80 L1160 55 L1260 55 L1260 75 L1360 75 L1360 45 L1460 45 L1460 80 L1600 80 L1600 120 L0 120 Z"
              fill="#0B1428" stroke="#00F0FF" stroke-width="0.9" opacity="0.85"/>
        <animateTransform attributeName="transform" type="translate" values="0,390;-100,390;0,390" dur="20s" repeatCount="indefinite"/>
      </g>
    </g>
    <g fill="#FCEE0A" filter="url(#b-soft)">
      <rect x="240" y="420" width="3" height="6"><animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite" begin="0.2s"/></rect>
      <rect x="420" y="430" width="3" height="6"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite" begin="1.1s"/></rect>
      <rect x="780" y="410" width="3" height="6"><animate attributeName="opacity" values="0;1;0" dur="2.9s" repeatCount="indefinite" begin="0.7s"/></rect>
      <rect x="1180" y="425" width="3" height="6"><animate attributeName="opacity" values="0;1;0" dur="3.4s" repeatCount="indefinite" begin="1.6s"/></rect>
      <rect x="1380" y="415" width="3" height="6"><animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite" begin="0.4s"/></rect>
    </g>
  </g>

  <path d="M40 50L70 20H1530L1560 50V450L1530 480H70L40 450V50Z"
        stroke="url(#frame)" stroke-width="2.2" fill="none" filter="url(#b-glow)"/>

  <text class="mono meta" x="72" y="44">SYS://ARENNULL.NODE // BANNER_REV 3.1</text>
  <text class="mono meta" x="1356" y="44">UPLINK_OK · STAY_CHROME</text>

  <g transform="translate(800,230)" text-anchor="middle">
    <text class="mono title" fill="#00F0FF" filter="url(#b-glow)" opacity="0.7">
      ARENNULL
      <animate attributeName="x" values="-2;2;-2" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.85;0.55" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text class="mono title" fill="#FF2A6D" filter="url(#b-glow)" opacity="0.7">
      ARENNULL
      <animate attributeName="x" values="2;-2;2" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.85;0.55" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text class="mono title" fill="#EAF7FF" filter="url(#b-soft)">ARENNULL</text>
  </g>

  <g transform="translate(800,280)" text-anchor="middle">
    <text class="mono sub" fill="#B9C7E6">// JACK_IN sequence initialized</text>
    <rect x="245" y="-14" width="10" height="18" fill="#7BFFB0">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(800,322)" text-anchor="middle">
    <text class="mono tag">TYPESCRIPT  ·  RAILWAY  ·  AI  ·  DATA</text>
  </g>

  <g transform="translate(72,395)">
    <line x1="0" y1="0" x2="1456" y2="0" stroke="#243657" stroke-width="1"/>
    <line x1="0" y1="0" x2="1456" y2="0" stroke="#FF2A6D" stroke-width="2" stroke-linecap="round"
          stroke-dasharray="60 1396" filter="url(#b-glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-1456" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="1456" y2="0" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"
          stroke-dasharray="40 1416" filter="url(#b-glow)">
      <animate attributeName="stroke-dashoffset" from="-1456" to="0" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <g transform="translate(72,432)">
    <text class="mono meta">PROTOCOL  trace → ship → refactor → sandbox</text>
  </g>
  <g transform="translate(1356,432)">
    <text class="mono meta">REV 3.1 · 0xDEAD//2077</text>
  </g>

  <g transform="translate(72,18)">
    <circle cx="0" cy="0" r="4" fill="#FF2A6D" filter="url(#b-soft)"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="14" cy="0" r="4" fill="#FCEE0A" filter="url(#b-soft)"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="28" cy="0" r="4" fill="#00F0FF" filter="url(#b-soft)"><animate attributeName="opacity" values="1;0.2;1" dur="2.0s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
