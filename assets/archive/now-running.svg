<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Now running — terminal style process readout">
  <defs>
    <linearGradient id="nr-edge" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FF2A6D"/>
    </linearGradient>
    <filter id="nr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family: "Cascadia Mono","Fira Code",Consolas,monospace; }
      .p { fill:#7BFFB0; font-size:16px; }
      .c { fill:#00F0FF; font-size:16px; }
      .h { fill:#FF2A6D; font-size:16px; }
      .y { fill:#FCEE0A; font-size:16px; }
      .d { fill:#B9C7E6; font-size:16px; }
      .mu{ fill:#6E84AC; font-size:12px; letter-spacing:1.5px; }
      .tit{ fill:#EAF7FF; font-size:13px; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="1200" height="180" rx="14" fill="#05030A"/>
  <rect x="6" y="6" width="1188" height="168" rx="10" stroke="url(#nr-edge)" stroke-width="1.8" filter="url(#nr-glow)"/>

  <rect x="6" y="6" width="1188" height="36" rx="10" fill="#0A0716"/>
  <circle cx="28" cy="24" r="6" fill="#FF2A6D"/>
  <circle cx="50" cy="24" r="6" fill="#FCEE0A"/>
  <circle cx="72" cy="24" r="6" fill="#00F0FF"/>
  <text class="m tit" x="100" y="29">arennull@netrun:~/active$ ps -ef | grep BUILDER</text>
  <text class="m mu"  x="1056" y="29">REV 3.0</text>

  <g transform="translate(24,66)">
    <text class="m d">PID</text>
    <text class="m d" x="96">USER</text>
    <text class="m d" x="246">CMD</text>
    <text class="m d" x="900">STATUS</text>
  </g>

  <g transform="translate(24,94)">
    <text class="m y">1077</text>
    <text class="m d" x="96">arennull</text>
    <text class="m c" x="246">node ai_api_lab/server.ts</text>
    <text class="m p" x="900">[ BUILDING ]</text>
  </g>
  <g transform="translate(24,118)">
    <text class="m y">1184</text>
    <text class="m d" x="96">arennull</text>
    <text class="m c" x="246">railway up &amp;&amp; ship_log --notes</text>
    <text class="m y" x="900">[ READY ]</text>
  </g>
  <g transform="translate(24,142)">
    <text class="m y">1209</text>
    <text class="m d" x="96">arennull</text>
    <text class="m c" x="246">refactor codecraft/* --trace</text>
    <text class="m h" x="900">[ ACTIVE ]</text>
  </g>

  <g transform="translate(24,162)">
    <text class="m mu">█</text>
    <text class="m mu" x="14">cursor</text>
    <rect x="62" y="-12" width="9" height="14" fill="#7BFFB0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
