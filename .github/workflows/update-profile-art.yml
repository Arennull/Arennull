name: Update profile art

# Re-scrapes the contribution calendar and re-renders the monochrome heatmap
# every day. Zero auth: it reads the public github.com contributions fragment.
# Requires Settings -> Actions -> Workflow permissions = "Read and write".

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight deps
        run: pip install -r scripts/requirements.txt

      - name: Scrape contributions + render heatmap
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: |
          python scripts/fetch_contributions.py contributions.json
          python scripts/render_heatmap_svg.py contributions.json contrib-heatmap.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg contributions.json
          git diff --staged --quiet || git commit -m "chore: refresh contribution heatmap"
          git push
